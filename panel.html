<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del día — Taller RL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F2EC;
    --surface: #FFFFFF;
    --ink: #2E2A26;
    --ink-soft: #6B6459;
    --line: #E7E0D3;
    --accent: #C97B5B;

    --ok: #3F8A62;
    --ok-bg: #E1F2E8;
    --warn: #B4763A;
    --warn-bg: #FBEEDD;

    --c-recepcion: #FDE2C8; --c-recepcion-ink: #7A4A1F;
    --c-desarme: #FBD4D8; --c-desarme-ink: #7A2E36;
    --c-diagnostico: #FBE8B8; --c-diagnostico-ink: #705A16;
    --c-ph: #D7F0D3; --c-ph-ink: #2F5C3A;
    --c-end: #CFEAE6; --c-end-ink: #205652;
    --c-recup: #CFE0F5; --c-recup-ink: #2A4C74;
    --c-terminacion: #DAD2F0; --c-terminacion-ink: #453275;
    --c-expedicion: #F0D2E8; --c-expedicion-ink: #732F63;
    --c-entregado: #E3E3E0; --c-entregado-ink: #55534C;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
  }

  h1, h2, h3 { font-family: 'Quicksand', 'Inter', sans-serif; }

  /* ---------- Layout shell ---------- */

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .header-title {
    font-size: 20px;
    font-weight: 700;
  }

  .header-sub {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .header-stats {
    display: flex;
    gap: 20px;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-size: 22px;
    font-weight: 700;
    font-family: 'Quicksand', sans-serif;
  }

  .stat-num.ok-color { color: var(--ok); }
  .stat-num.warn-color { color: var(--warn); }

  .stat-label {
    font-size: 10.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .body-split {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .tab-bar {
    display: flex;
    gap: 6px;
    padding: 10px 24px 0;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .tab-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    padding: 9px 16px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
  }

  .tab-btn.active {
    color: var(--accent);
    background: var(--bg);
  }

  /* ---------- Entregas (tabla) ---------- */

  .backlog-zone {
    flex: 1;
    overflow-y: auto;
    padding: 18px 24px;
    min-width: 0;
  }

  .backlog-section-title {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 14px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .backlog-section-title.expedicion {
    color: var(--c-expedicion-ink);
  }

  .backlog-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 26px;
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--line);
  }

  .backlog-table th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding: 9px 12px;
    background: #F1ECE2;
    border-bottom: 1px solid var(--line);
  }

  .backlog-table td {
    padding: 10px 12px;
    font-size: 12.5px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }

  .backlog-table tr:last-child td {
    border-bottom: none;
  }

  .backlog-table tr.expedicion-row {
    background: #FDF6FB;
  }

  .bk-ot {
    font-weight: 700;
    white-space: nowrap;
  }

  .bk-detalle {
    font-weight: 600;
  }

  .bk-cliente {
    color: var(--ink-soft);
    font-size: 11.5px;
    margin-top: 2px;
  }

  .sector-pill {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .planif-tag {
    font-size: 11.5px;
    white-space: nowrap;
  }

  .planif-tag.missing {
    color: var(--err, #B4544A);
    font-weight: 700;
    background: #FBE9E7;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .entrega-tag {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
    white-space: nowrap;
    display: inline-block;
  }

  .entrega-tag.vencido {
    background: #FBE2DF;
    color: #A0392F;
  }

  .entrega-tag.proximo {
    background: var(--warn-bg);
    color: var(--warn);
  }

  .entrega-tag.normal {
    background: #EFEBE2;
    color: var(--ink-soft);
  }

  .entrega-tag.sinFecha {
    background: transparent;
    color: var(--ink-soft);
    font-style: italic;
    font-weight: 500;
  }

  /* ---------- Kanban zone ---------- */

  .board-zone {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 18px;
    display: flex;
    gap: 12px;
    align-items: stretch;
    min-width: 0;
  }

  .column {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--line);
    flex: 1 1 0;
    min-width: 175px;
    max-width: 260px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
    overflow: hidden;
  }

  .column-header {
    padding: 11px 12px;
    border-radius: 14px 14px 0 0;
    font-weight: 700;
    font-size: 11.5px;
    letter-spacing: 0.01em;
    line-height: 1.35;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .column-header-top {
    display: flex;
    justify-content: flex-end;
  }

  .column-count {
    background: rgba(255,255,255,0.55);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11px;
  }

  .column-cards {
    padding: 10px;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .column-empty {
    padding: 16px 10px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    opacity: 0.6;
  }

  /* ---------- Card ---------- */

  .card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 11px;
    background: var(--bg);
    min-width: 0;
  }

  .card-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 8px;
  }

  .card-ot {
    font-weight: 700;
    font-size: 12.5px;
  }

  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge.ok {
    background: var(--ok-bg);
    color: var(--ok);
  }

  .badge.warn {
    background: var(--warn-bg);
    color: var(--warn);
  }

  .card-detalle {
    font-size: 11.5px;
    color: var(--ink);
    margin-top: 5px;
    line-height: 1.4;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .card-cliente {
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 4px;
    overflow-wrap: break-word;
  }

  .card-tarea {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-top: 6px;
    padding: 2px 7px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  /* ---------- Feed sidebar ---------- */

  .feed-zone {
    width: 230px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .feed-header {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .feed-title {
    font-size: 14px;
    font-weight: 700;
  }

  .feed-sub {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .feed-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }

  .feed-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }

  .feed-item:last-child { border-bottom: none; }

  .feed-time {
    font-size: 10.5px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .feed-main {
    font-size: 12.5px;
    margin-top: 3px;
    line-height: 1.4;
  }

  .feed-ot {
    font-weight: 700;
  }

  .feed-campo {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-top: 2px;
  }

  .feed-vals {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .feed-empty {
    padding: 30px 14px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
  }

  /* ---------- Scrollbars ---------- */

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #D8D0C0; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .state-panel {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    width: 100%;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <div class="header-title">Panel del día — Taller RL</div>
      <div class="header-sub" id="headerSub">Cargando…</div>
    </div>
    <div class="header-stats" id="headerStats">
      <div class="stat">
        <div class="stat-num" id="statTotal">–</div>
        <div class="stat-label" id="statTotalLabel">OTs hoy</div>
      </div>
      <div class="stat">
        <div class="stat-num ok-color" id="statUpdated">–</div>
        <div class="stat-label" id="statUpdatedLabel">Actualizadas</div>
      </div>
      <div class="stat">
        <div class="stat-num warn-color" id="statPending">–</div>
        <div class="stat-label" id="statPendingLabel">Sin novedades</div>
      </div>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="ronda">Ronda de hoy</button>
    <button class="tab-btn" data-tab="entregas">Entregas</button>
  </div>

  <div class="body-split" id="bodySplit">
    <div class="board-zone" id="boardZone">
      <div class="state-panel">Cargando el panel…</div>
    </div>
    <div class="backlog-zone" id="backlogZone" style="display:none;"></div>
    <div class="feed-zone" id="feedZone">
      <div class="feed-header">
        <div class="feed-title">Actualizaciones de hoy</div>
        <div class="feed-sub" id="feedSub">–</div>
      </div>
      <div class="feed-list" id="feedList">
        <div class="feed-empty">Cargando…</div>
      </div>
    </div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6c4W7SofbiqOo01ZNfOz1QQgdnvg2jd_BkuwPGDAvgbedQdqrtiEroQjXeryfbztN/exec";
  const AUTO_REFRESH_MS = 90000; // 90 segundos

  // RECEPCION Y ADMIN y RECUP COMPONENTES se omiten del tablero a pedido.
  const COLUMNAS = [
    { label: "DESARME, DIAGNOSTICO Y ARMADO", css: "desarme", match: ["DESARME, DIAGNOSTICO Y ARMADO"] },
    { label: "PH", css: "ph", match: ["PH"] },
    { label: "END", css: "end", match: ["END"] },
    { label: "TERMINACION", css: "terminacion", match: ["TERMINACION"] },
    { label: "EXPEDICION", css: "expedicion", match: ["EXPEDICION"] },
    { label: "ENTREGADO", css: "entregado", match: ["ENTREGADO"] }
  ];

  function findColumn(rawSector) {
    const norm = String(rawSector || "").trim().toUpperCase();
    return COLUMNAS.find(c => c.match.indexOf(norm) !== -1) || null;
  }

  const boardZone = document.getElementById("boardZone");
  const backlogZone = document.getElementById("backlogZone");
  const feedZone = document.getElementById("feedZone");
  const feedList = document.getElementById("feedList");
  const headerSub = document.getElementById("headerSub");
  const feedSub = document.getElementById("feedSub");
  const statTotal = document.getElementById("statTotal");
  const statUpdated = document.getElementById("statUpdated");
  const statPending = document.getElementById("statPending");
  const statTotalLabel = document.getElementById("statTotalLabel");
  const statUpdatedLabel = document.getElementById("statUpdatedLabel");
  const statPendingLabel = document.getElementById("statPendingLabel");

  let activeTab = "ronda";
  let lastPayload = null;

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTab = btn.getAttribute("data-tab");
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
      boardZone.style.display = activeTab === "ronda" ? "flex" : "none";
      feedZone.style.display = activeTab === "ronda" ? "flex" : "none";
      backlogZone.style.display = activeTab === "entregas" ? "block" : "none";
      if (lastPayload) renderStats();
    });
  });

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function loadData() {
    try {
      const res = await fetch(APPS_SCRIPT_URL, { method: "GET" });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "Respuesta inválida");
      lastPayload = json;
      renderBoard(json.items || []);
      renderFeed(json.updates || []);
      renderBacklog(json.backlog || []);
      renderStats();
      headerSub.textContent = "Actualizado a las " + json.generatedAt.split(" ")[1] + " · próxima actualización automática en 90s";
    } catch (err) {
      boardZone.innerHTML = `<div class="state-panel">No se pudo conectar. Reintentando en 90s…<br><span style="font-size:11px; opacity:0.7;">${escapeHtml(err.message)}</span></div>`;
    }
  }

  function renderStats() {
    if (!lastPayload) return;
    if (activeTab === "ronda") {
      const items = lastPayload.items || [];
      const updatedCount = items.filter(i => i.actualizadoHoy).length;
      statTotalLabel.textContent = "OTs hoy";
      statUpdatedLabel.textContent = "Actualizadas";
      statPendingLabel.textContent = "Sin novedades";
      statTotal.textContent = items.length;
      statUpdated.textContent = updatedCount;
      statPending.textContent = items.length - updatedCount;
    } else {
      const backlog = lastPayload.backlog || [];
      const vencidas = backlog.filter(b => b.urgencia === "vencido").length;
      const proximas = backlog.filter(b => b.urgencia === "proximo").length;
      statTotalLabel.textContent = "OTs pendientes";
      statUpdatedLabel.textContent = "Próximas a vencer";
      statPendingLabel.textContent = "Vencidas";
      statTotal.textContent = backlog.length;
      statUpdated.textContent = proximas;
      statPending.textContent = vencidas;
    }
  }

  function renderBoard(items) {
    if (items.length === 0) {
      boardZone.innerHTML = `<div class="state-panel">No hay OTs planificadas para hoy.</div>`;
      return;
    }

    const groups = {};
    COLUMNAS.forEach(c => groups[c.label] = []);

    items.forEach(item => {
      const col = findColumn(item.sector);
      if (col) groups[col.label].push(item);
      // Los que no matchean ninguna columna (ej. RECEPCION Y ADMIN) quedan fuera del tablero a propósito.
    });

    let html = "";

    COLUMNAS.forEach(c => {
      const list = groups[c.label];
      html += `
        <div class="column">
          <div class="column-header" style="background:var(--c-${c.css}); color:var(--c-${c.css}-ink);">
            <div class="column-header-top"><span class="column-count">${list.length}</span></div>
            <span>${escapeHtml(c.label)}</span>
          </div>
          <div class="column-cards">
            ${list.length === 0 ? '<div class="column-empty">Sin OTs</div>' : list.map(cardHtml).join("")}
          </div>
        </div>
      `;
    });

    boardZone.innerHTML = html;
  }

  function cardHtml(item) {
    const badge = item.actualizadoHoy
      ? `<span class="badge ok">✓ Actualizado</span>`
      : `<span class="badge warn">⚠ Pendiente</span>`;
    return `
      <div class="card">
        <div class="card-top">
          <span class="card-ot">OT ${escapeHtml(item.ot)}</span>
          ${badge}
        </div>
        <div class="card-detalle">${escapeHtml(item.detalle || "—")}</div>
        <div class="card-cliente">${escapeHtml(item.cliente || "")}</div>
        ${item.tareaARealizar ? `<div class="card-tarea">${escapeHtml(item.tareaARealizar)}</div>` : ""}
      </div>
    `;
  }

  const SECTOR_CSS_MAP = {
    "RECEPCION Y ADMIN": "recepcion",
    "DESARME, DIAGNOSTICO Y ARMADO": "desarme",
    "PH": "ph",
    "END": "end",
    "RECUP COMPONENTES": "recup",
    "TERMINACION": "terminacion",
    "EXPEDICION": "expedicion",
    "ENTREGADO": "entregado"
  };

  function sectorPillHtml(rawSector) {
    const norm = String(rawSector || "").trim().toUpperCase();
    const css = SECTOR_CSS_MAP[norm];
    if (!css) {
      return `<span class="sector-pill" style="background:#EEEAE3; color:#6B6459;">${escapeHtml(rawSector || "—")}</span>`;
    }
    return `<span class="sector-pill" style="background:var(--c-${css}); color:var(--c-${css}-ink);">${escapeHtml(rawSector)}</span>`;
  }

  function backlogRowHtml(b) {
    const planifHtml = b.sinPlanificacion
      ? `<span class="planif-tag missing">⚠ Sin planificar</span>`
      : `<span class="planif-tag">${escapeHtml(b.fechaPlanificacion)}</span>`;

    const entregaLabel = b.urgencia === "sinFecha" ? "Sin fecha"
      : b.urgencia === "vencido" ? "⛔ " + escapeHtml(b.fechaEntrega)
      : b.urgencia === "proximo" ? "⚠ " + escapeHtml(b.fechaEntrega)
      : escapeHtml(b.fechaEntrega);

    return `
      <tr class="${b.enExpedicion ? "expedicion-row" : ""}">
        <td class="bk-ot">OT ${escapeHtml(b.ot)}</td>
        <td>
          <div class="bk-detalle">${escapeHtml(b.detalle || "—")}</div>
          <div class="bk-cliente">${escapeHtml(b.cliente || "")}</div>
        </td>
        <td>${sectorPillHtml(b.sector)}</td>
        <td>${escapeHtml(b.tareaARealizar || "—")}</td>
        <td>${planifHtml}</td>
        <td><span class="entrega-tag ${b.urgencia}">${entregaLabel}</span></td>
      </tr>
    `;
  }

  function backlogTableHtml(list) {
    return `
      <table class="backlog-table">
        <thead>
          <tr>
            <th>OT</th>
            <th>Detalle / Cliente</th>
            <th>Sector</th>
            <th>Tarea a realizar</th>
            <th>Planificación</th>
            <th>Entrega</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(backlogRowHtml).join("")}
        </tbody>
      </table>
    `;
  }

  function renderBacklog(backlog) {
    if (backlog.length === 0) {
      backlogZone.innerHTML = `<div class="state-panel">No hay OTs pendientes cargadas.</div>`;
      return;
    }

    const expedicion = backlog.filter(b => b.enExpedicion);
    const resto = backlog.filter(b => !b.enExpedicion);

    let html = "";

    if (expedicion.length > 0) {
      html += `
        <div class="backlog-section-title expedicion">🚚 Listos para entregar — Expedición (${expedicion.length})</div>
        ${backlogTableHtml(expedicion)}
      `;
    }

    html += `
      <div class="backlog-section-title">Resto de OTs pendientes, ordenadas por fecha de entrega (${resto.length})</div>
      ${backlogTableHtml(resto)}
    `;

    backlogZone.innerHTML = html;
  }

  function renderFeed(updates) {
    if (updates.length === 0) {
      feedList.innerHTML = `<div class="feed-empty">Todavía no hay actualizaciones cargadas hoy.</div>`;
      feedSub.textContent = "0 movimientos";
      return;
    }

    feedSub.textContent = updates.length + " movimiento" + (updates.length === 1 ? "" : "s");

    feedList.innerHTML = updates.map(u => `
      <div class="feed-item">
        <div class="feed-time">${escapeHtml(u.fechaHora.split(" ")[1] || u.fechaHora)}</div>
        <div class="feed-main"><span class="feed-ot">OT ${escapeHtml(u.ot)}</span></div>
        <div class="feed-campo">${escapeHtml(u.campo)}</div>
        ${u.campo !== "OBSERVACION" ? `<div class="feed-vals">${escapeHtml(u.valorAnterior || "—")} → ${escapeHtml(u.valorNuevo || "—")}</div>` : `<div class="feed-vals">${escapeHtml(u.valorNuevo || "")}</div>`}
      </div>
    `).join("");
  }

  loadData();
  setInterval(loadData, AUTO_REFRESH_MS);
</script>

</body>
</html>
